<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>Cielo</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 5%,#293c51 0,transparent 46%),#101827;color:#f8f6f1;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:0 21px}.page{max-width:520px;margin:auto}.brand{padding-top:28px;font-weight:800;font-size:18px}.sun{color:#ffd27a}main{padding-top:47px}.tag{color:#9fe7e2;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}h1{font-size:43px;line-height:1.06;letter-spacing:-2px;margin:14px 0}.gold{color:#ffd27a}.desc{color:#afbdce;font-size:14px;line-height:1.65;margin:0 0 23px}.search{display:flex;gap:7px;background:#ffffff0c;border:1px solid #ffffff20;border-radius:13px;padding:6px}.search input{min-width:0;flex:1;background:transparent;border:0;color:white;padding:0 8px;font-size:14px;outline:0}.search button{background:#ffd27a;border:0;border-radius:9px;padding:0 13px;font-weight:700}.hint{min-height:27px;color:#a0afc2;font-size:11px;padding-top:8px}.card{margin-top:14px;background:linear-gradient(130deg,#26374c,#192438 72%);border:1px solid #ffffff1a;border-radius:20px;padding:23px;position:relative;overflow:hidden}.card:after{content:'☼';position:absolute;right:12px;top:-4px;font-size:126px;color:#ffd27a1b}.top,.weather,.stats{position:relative;z-index:1}.place{font-size:18px;font-weight:700}.date{color:#a8b7c9;font-size:11px;margin-top:4px}.weather{display:flex;align-items:center;gap:10px;margin:24px 0 21px}.temp{font-size:66px;line-height:1;letter-spacing:-4px;font-weight:500}.emoji{font-size:42px}.desc2{font-size:12px;color:#c6d0de;margin-top:7px}.stats{display:flex;justify-content:space-between;border-top:1px solid #ffffff1b;padding-top:15px}.lab{font-size:9px;color:#9cacc0;margin-bottom:5px}.val{font-size:14px;font-weight:700}.foot{color:#8393a7;font-size:10px;line-height:1.6;margin-top:23px}.spinner{opacity:.7}
</style></head><body><div class="page"><header class="brand"><span class="sun">☼</span> cielo</header><main><div class="tag">Tu día, en sintonía</div><h1>Salí sabiendo<br><span class="gold">qué esperar.</span></h1><p class="desc">El clima de hoy, claro y sin vueltas. Buscá tu ciudad y salí preparado.</p><div class="search"><input id="q" placeholder="Escribí una ciudad" aria-label="Ciudad"><button id="go">Buscar</button></div><div class="hint" id="hint" aria-live="polite"></div><section class="card"><div class="top"><div class="place" id="place">Buenos Aires</div><div class="date" id="date"></div></div><div class="weather"><div><div style="display:flex;align-items:center;gap:8px"><div class="temp" id="temp">—°</div><div class="emoji" id="emoji">☀</div></div><div class="desc2" id="desc">Buscando el clima…</div></div></div><div class="stats"><div><div class="lab">SENSACIÓN</div><div class="val" id="feel">—°</div></div><div><div class="lab">HUMEDAD</div><div class="val" id="humidity">—%</div></div><div><div class="lab">VIENTO</div><div class="val" id="wind">— km/h</div></div></div></section><div class="foot">Pronóstico meteorológico de Open-Meteo.<br>Temperatura en °C · Viento en km/h.</div></main></div><script>
const $=x=>document.getElementById(x);$('date').textContent=new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());const text={0:'Despejado',1:'Mayormente despejado',2:'Algo nublado',3:'Nublado',45:'Niebla',48:'Niebla con escarcha',51:'Llovizna ligera',53:'Llovizna',55:'Llovizna intensa',61:'Lluvia ligera',63:'Lluvia',65:'Lluvia intensa',71:'Nevada ligera',73:'Nevada',75:'Nevada intensa',80:'Chaparrones ligeros',81:'Chaparrones',82:'Chaparrones intensos',95:'Tormenta',96:'Tormenta con granizo',99:'Tormenta fuerte'};const ico=c=>c===0?'☀':c<=2?'🌤':c<=48?'☁':c<70?'🌧':c<80?'❄':c<90?'🌦':'⛈';async function weather(lat,lon,name){$('hint').textContent='Actualizando el pronóstico…';try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`);if(!r.ok)throw Error();const d=await r.json(),c=d.current;$('place').textContent=name;$('temp').textContent=Math.round(c.temperature_2m)+'°';$('desc').textContent=text[c.weather_code]||'Clima variable';$('emoji').textContent=ico(c.weather_code);$('feel').textContent=Math.round(c.apparent_temperature)+'°';$('humidity').textContent=c.relative_humidity_2m+'%';$('wind').textContent=Math.round(c.wind_speed_10m)+' km/h';$('hint').textContent='Actualizado · '+new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit',timeZone:d.timezone}).format(new Date())}catch(e){$('desc').textContent='No se pudo cargar el clima';$('hint').textContent='Revisá tu conexión e intentá de nuevo.'}}async function search(){const q=$('q').value.trim();if(!q){$('hint').textContent='Escribí el nombre de una ciudad.';return}$('hint').textContent='Buscando ciudad…';try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=es&format=json'),d=await r.json();if(!d.results?.length)throw Error();const x=d.results[0];weather(x.latitude,x.longitude,[x.name,x.admin1,x.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(', '))}catch(e){$('hint').textContent='No encontramos esa ciudad. Probá con otro nombre.'}}$('go').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});weather(-34.6037,-58.3816,'Buenos Aires');
</script></body></html>
